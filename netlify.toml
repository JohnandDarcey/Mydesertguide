[build]
  publish = "outputs/desert-insider"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[redirects]]
  from = "/restaurants"
  to = "/food-drink/"
  status = 301

[[redirects]]
  from = "/professionals"
  to = "/trusted-professionals/"
  status = 301

[[redirects]]
  from = "/api/analytics/collect"
  to = "/.netlify/functions/analytics-collect"
  status = 200

[[redirects]]
  from = "/api/analytics/summary"
  to = "/.netlify/functions/analytics-summary"
  status = 200

[[redirects]]
  from = "/api/analytics/send-test-report"
  to = "/.netlify/functions/analytics-send-report"
  status = 200

[[redirects]]
  from = "/api/analytics/preview-report"
  to = "/.netlify/functions/analytics-preview-report"
  status = 200
